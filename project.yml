name: SparkRPGM

options:
  bundleIdPrefix: com.faith
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

attributes:
  ORGANIZATIONNAME: SparkRPGM

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    GCC_OPTIMIZATION_LEVEL: s
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ONLY_ACTIVE_ARCH: "NO"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    exactVersion: "4.8.7"
  UnrarSwift:
    url: https://github.com/mtgto/Unrar.swift.git
    from: "0.3.0"

targets:
  SparkRPGM:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SparkRPGM
        excludes:
          - "Info.plist"
          - "Resources/WebRuntime"
          - "Resources/JS"
          - "**/.DS_Store"
      - path: SparkRPGM/Resources/JS
        buildPhase: resources
      - path: SparkRPGM/Resources/WebRuntime
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: SWCompression
        product: SWCompression
      - package: UnrarSwift
        product: Unrar
    settings:
      base:
        PRODUCT_NAME: SparkRPGM
        PRODUCT_BUNDLE_IDENTIFIER: com.faith.sparkrpgm
        INFOPLIST_FILE: SparkRPGM/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_BITCODE: "NO"

schemes:
  SparkRPGM:
    build:
      targets:
        SparkRPGM: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
